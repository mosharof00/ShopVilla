  flutter_speed_dial: ^7.0.0
  just_audio: ^0.10.0
  coupon_uikit: ^0.2.1
  radio_group_v2: ^3.2.0
  delightful_toast: ^1.1.0
  rounded_loading_button_plus: ^3.0.1
  clipboard: ^0.1.3
