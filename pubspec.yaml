  change_app_package_name: ^1.3.0
  open_file: ^3.3.2
  path_provider: ^2.1.1
  pdf: ^3.10.4
  chip_list: ^3.1.0
  flutter_widget_from_html_core: ^0.16.0
  drop_down_list: ^2.0.0
  bijoy_helper: ^1.0.1
  open_file_macos: ^0.1.0



dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  build_runner:
  flutter_gen_runner:

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/singleLogo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/logo/singleLogo.png"
    background_color: "#FFFFFF"
    theme_color: "#2575FC"
  windows:
    generate: true
    image_path: "assets/logo/singleLogo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/logo/singleLogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/
    - assets/fonts/
    - assets/flag/
    - assets/json/language.json
    - assets/json/
    - assets/tone/success_tone.mp3
    - assets/tone/correct.mp3

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 200
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 500
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 800
    - family: Gothic
      fonts:
        - asset: assets/fonts/gothicA1_regular.ttf
          weight: 500


flutter_gen:
  colors:
    inputs:
      - assets/color/colors.xml